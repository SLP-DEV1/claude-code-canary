name: Bug report
description: Report a reproducible Claude Code Canary bug
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make regressions reproducible. Please remove API keys, tokens, private prompts, paths and other sensitive data before pasting logs or attaching Canary result artifacts.
  - type: input
    id: canary-version
    attributes:
      label: Canary version
      description: Run `claude-canary --version`.
      placeholder: 1.2.0
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Run `claude --version` when the bug involves a Claude Code execution.
      placeholder: 2.x.x
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2 / Ubuntu 24.04 / macOS 15
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Run `node --version`.
      placeholder: v22.x.x
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected workflow
      options:
        - run / validate / init
        - compare / bisect / versions
        - pr-check / baseline
        - plugin-init / plugin-matrix / plugin-suite
        - mcp-snapshot / mcp-check
        - doctor
        - experiment / record / replay / repro
        - GitHub Action
        - Programmatic API
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Paste the smallest scenario and exact commands needed to reproduce the problem. Prefer a public minimal repository when one is necessary.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Relevant output or redacted result artifact
      description: Paste only the smallest useful output. Remove secrets/private data first. Do not paste full transcripts unless they are necessary and safe to publish.
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I reproduced this with a currently supported Canary version or explained why I cannot.
          required: true
        - label: I removed secrets and private data from the reproduction, logs and artifacts.
          required: true
        - label: I searched existing open and closed issues for the same problem.
          required: true
