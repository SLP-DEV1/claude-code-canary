name: CI

on:
  push:
    branches: [main, feat/plugin-smoke-generator]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Smoke-test CLI name
        run: |
          node dist/index.js --help | grep -q "Usage: claude-canary"
          node dist/index.js plugin-init --help | grep -q "generate smoke-test scenarios"
          node dist/index.js plugin-matrix --help | grep -q "Test one Claude Code plugin"
