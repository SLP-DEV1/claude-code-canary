name: Finalize regression semantics feature

on:
  push:
    branches:
      - feat/regression-semantics
    paths:
      - .github/workflows/feature-regression-semantics-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/regression-semantics
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Wire compare command and documentation
        run: python scripts/finalize-regression-semantics.py

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run build

      - name: Commit validated feature
        shell: bash
        run: |
          rm .github/workflows/feature-regression-semantics-once.yml
          rm scripts/finalize-regression-semantics.py
          git config user.name "Claude Canary CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/index.ts README.md CHANGELOG.md .github/workflows/feature-regression-semantics-once.yml scripts/finalize-regression-semantics.py
          git commit -m "feat: detect efficiency and lifecycle regressions"
          git push origin HEAD:feat/regression-semantics
