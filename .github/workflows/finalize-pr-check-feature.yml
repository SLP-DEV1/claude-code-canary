name: Finalize PR check feature

on:
  push:
    branches:
      - feat/pr-check-baselines

permissions:
  contents: write

concurrency:
  group: finalize-pr-check-feature
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: feat/pr-check-baselines
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Apply CLI and documentation integration
        run: node scripts/finalize-pr-check-feature.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate feature
        run: npm run check
      - name: Syntax-check dependency-free Action helpers
        run: |
          node --check scripts/action-runner.mjs
          node --check scripts/pr-comment.mjs
          node --check scripts/ensure-pr-refs.mjs
      - name: Commit validated integration and remove one-shot helpers
        run: |
          rm scripts/finalize-pr-check-feature.mjs
          rm .github/workflows/finalize-pr-check-feature.yml
          git config user.name "SLP-DEV1"
          git config user.email "aufgeklebt@outlook.de"
          git add -A
          git diff --cached --check
          git commit -m "feat: wire PR checks and baselines into CLI"
          git push origin HEAD:feat/pr-check-baselines
