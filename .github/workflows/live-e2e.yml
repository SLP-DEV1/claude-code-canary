name: Live Claude E2E
run-name: Live Claude E2E (${{ github.event_name == 'schedule' && 'core' || inputs.mode }})

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Live coverage level. Full adds record/replay, experiment, bisect, plugins and Action self-test.
        required: true
        default: core
        type: choice
        options:
          - core
          - full
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: live-claude-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_MODE: ${{ github.event_name == 'schedule' && 'core' || inputs.mode }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CLAUDE_CANARY_GEMINI_MODEL: gemini-2.5-flash-lite
      CLAUDE_CANARY_GROQ_MODEL: openai/gpt-oss-120b
      CLAUDE_CANARY_OPENROUTER_MODEL: openrouter/free

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure live E2E paths
        shell: bash
        run: |
          echo "CLAUDE_CANARY_PROVIDER_DIR=$RUNNER_TEMP/claude-canary-provider-e2e" >> "$GITHUB_ENV"
          echo "CLAUDE_CANARY_E2E_DIR=$RUNNER_TEMP/claude-canary-live-e2e" >> "$GITHUB_ENV"

      - name: Check free provider authentication
        id: auth
        shell: bash
        run: |
          if [[ -n "${GEMINI_API_KEY:-}" || -n "${GROQ_API_KEY:-}" || -n "${OPENROUTER_API_KEY:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Live Claude E2E skipped: configure GEMINI_API_KEY, GROQ_API_KEY and/or OPENROUTER_API_KEY as Actions secrets."
          fi

      - name: Explain skipped scheduled live test
        if: github.event_name == 'schedule' && steps.auth.outputs.configured != 'true'
        shell: bash
        run: |
          {
            echo "### Live Claude E2E skipped"
            echo
            echo "Configure \`GEMINI_API_KEY\` for the preferred free provider and optionally \`OPENROUTER_API_KEY\` for fallback. \`GROQ_API_KEY\` remains supported for existing setups."
            echo "Scheduled runs intentionally stay green when no provider key is configured."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reject manual live test without provider auth
        if: github.event_name == 'workflow_dispatch' && steps.auth.outputs.configured != 'true'
        shell: bash
        run: |
          echo "::error::Manual Live Claude E2E requires GEMINI_API_KEY, GROQ_API_KEY and/or OPENROUTER_API_KEY. A skipped manual run must never count as release evidence."
          exit 1

      - name: Install dependencies and build Canary
        if: steps.auth.outputs.configured == 'true'
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Install latest Claude Code
        if: steps.auth.outputs.configured == 'true'
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show Claude Code version
        if: steps.auth.outputs.configured == 'true'
        shell: bash
        run: claude --version

      - name: Build pinned headless provider router
        if: steps.auth.outputs.configured == 'true'
        shell: bash
        env:
          CCASR_SHA: 47e06284af53a6bef86bba0f411977b92db82440
        run: |
          ROUTER_DIR="$RUNNER_TEMP/claude-code-agent-sdk-router"
          rm -rf "$ROUTER_DIR"
          git init "$ROUTER_DIR"
          git -C "$ROUTER_DIR" remote add origin https://github.com/sarukas/claude-code-agent-sdk-router.git
          git -C "$ROUTER_DIR" fetch --depth=1 origin "$CCASR_SHA"
          git -C "$ROUTER_DIR" checkout --detach FETCH_HEAD
          npm --prefix "$ROUTER_DIR" ci --ignore-scripts --no-audit --no-fund
          npm --prefix "$ROUTER_DIR" run build
          echo "CLAUDE_CANARY_CCASR_CLI=$ROUTER_DIR/dist/cli.js" >> "$GITHUB_ENV"

      - name: Run provider-backed live CLI E2E
        id: provider
        if: steps.auth.outputs.configured == 'true'
        shell: bash
        env:
          CLAUDE_CANARY_E2E_KEEP: "1"
        run: node scripts/live-provider-e2e.mjs run "$E2E_MODE"

      - name: Prepare Action self-test fixture
        if: steps.auth.outputs.configured == 'true' && env.E2E_MODE == 'full'
        shell: bash
        run: |
          mkdir -p .canary
          cat > .canary/action-live.canary.yml <<'YAML'
          version: 1
          name: live-action-self-test
          prompt: |
            Create action-live-result.txt in the repository root containing exactly the single line ACTION_OK.
            Do not modify, delete, or create any other repository file.
          claude:
            executable: claude
            permission_mode: bypassPermissions
            max_turns: 10
            timeout_seconds: 240
          verify:
            commands:
              - node -e "const fs=require('fs'); if(fs.readFileSync('action-live-result.txt','utf8').trim()!=='ACTION_OK') process.exit(1)"
          expect:
            changed_files:
              allow:
                - action-live-result.txt
              require:
                - action-live-result.txt
              deny: []
            files_exist:
              - action-live-result.txt
            file_contains:
              - path: action-live-result.txt
                text: ACTION_OK
          limits:
            max_tool_calls: 20
            max_total_tokens: 120000
          YAML
          git config user.name "Claude Canary E2E"
          git config user.email "claude-canary-e2e@example.invalid"
          git config commit.gpgsign false
          git add .canary/action-live.canary.yml
          git commit -m "test: live Action fixture"

      - name: Start selected provider for Action self-test
        if: steps.auth.outputs.configured == 'true' && env.E2E_MODE == 'full'
        shell: bash
        run: node scripts/live-provider-e2e.mjs start-selected

      - name: Run local Claude Canary Action
        if: steps.auth.outputs.configured == 'true' && env.E2E_MODE == 'full'
        uses: ./
        with:
          mode: run
          scenario: .canary/action-live.canary.yml
          upload-results: "false"

      - name: Stop Action self-test provider router
        if: always() && steps.auth.outputs.configured == 'true' && env.E2E_MODE == 'full'
        shell: bash
        run: node scripts/live-provider-e2e.mjs stop

      - name: Upload live E2E evidence
        if: always() && steps.auth.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-claude-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/claude-canary-live-e2e/fixture/.canary/results/
            ${{ runner.temp }}/claude-canary-live-e2e/fixture/.canary/repro-live/
            ${{ runner.temp }}/claude-canary-provider-e2e/
            .canary/results/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Write live E2E summary
        if: always() && steps.auth.outputs.configured == 'true'
        shell: bash
        run: |
          {
            echo "### Live Claude E2E"
            echo
            echo "- Mode: \`$E2E_MODE\`"
            echo "- Release-evidence run name: \`Live Claude E2E ($E2E_MODE)\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Claude Code: \`$(claude --version 2>/dev/null || echo unavailable)\`"
            echo "- Primary provider: \`${{ steps.provider.outputs['primary-provider'] || 'not completed' }}\`"
            echo "- Provider used: \`${{ steps.provider.outputs.provider || 'not completed' }}\`"
            echo "- Model: \`${{ steps.provider.outputs.model || 'not completed' }}\`"
            echo "- Capacity fallback used: \`${{ steps.provider.outputs['fallback-used'] || 'false' }}\`"
            echo "- CLI fixture results: \`${{ runner.temp }}/claude-canary-live-e2e/fixture/.canary/results\`"
          } >> "$GITHUB_STEP_SUMMARY"
