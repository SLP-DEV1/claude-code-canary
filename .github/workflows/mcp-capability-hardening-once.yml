name: MCP capability hardening once

on:
  push:
    branches:
      - feat/mcp-contract-testing
    paths:
      - scripts/patch-mcp-capability-regression.mjs
      - .github/workflows/mcp-capability-hardening-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Apply capability hardening patch
        run: node scripts/patch-mcp-capability-regression.mjs

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate feature
        run: npm run check

      - name: Package sanity
        run: npm pack --dry-run --ignore-scripts

      - name: Commit validated capability hardening
        shell: bash
        run: |
          rm scripts/patch-mcp-capability-regression.mjs
          rm .github/workflows/mcp-capability-hardening-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "fix: detect removed MCP capabilities"
          git push origin HEAD:feat/mcp-contract-testing
