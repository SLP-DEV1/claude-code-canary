name: MCP slug hardening once

on:
  push:
    branches:
      - feat/mcp-contract-testing
    paths:
      - .github/workflows/mcp-trim-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/mcp-contract-testing
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Remove regex edge trimming
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/mcp-contract.ts')
          text = path.read_text(encoding='utf-8')
          old = """function slug(value: string): string {
            const normalized = value.toLowerCase().replace(/[^a-z0-9._-]+/g, '-');
            const withoutLeading = normalized.replace(/^-+/, '');
            const withoutTrailing = withoutLeading.replace(/-+$/, '');
            return withoutTrailing.slice(0, 80) || 'mcp';
          }
          """
          new = """function slug(value: string): string {
            const normalized = value.toLowerCase().replace(/[^a-z0-9._-]+/g, '-');
            let start = 0;
            while (start < normalized.length && normalized.charCodeAt(start) === 45) start += 1;
            let end = normalized.length;
            while (end > start && normalized.charCodeAt(end - 1) === 45) end -= 1;
            return normalized.slice(start, Math.min(end, start + 80)) || 'mcp';
          }
          """
          if old not in text:
              raise SystemExit('expected slug block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate feature
        run: npm run check
      - name: Package sanity
        run: npm pack --dry-run --ignore-scripts
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mcp-contract.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: remove regex edge trimming from MCP slug"
          git push origin HEAD:feat/mcp-contract-testing
