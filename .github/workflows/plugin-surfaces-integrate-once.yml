name: Integrate plugin surfaces once

on:
  push:
    branches: [feat/plugin-compat-surfaces]
    paths: [.github/workflows/plugin-surfaces-integrate-once.yml]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/plugin-compat-surfaces
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Integrate discovery surfaces
        shell: python
        run: |
          from pathlib import Path

          def patch(file, old, new):
              p = Path(file)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected block not found in {file}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          patch('src/plugin-init.ts',
            "import YAML from 'yaml';\n",
            "import YAML from 'yaml';\nimport { discoverExtendedPluginSurfaces, type PluginDependency, type PluginLspServer, type PluginMonitor } from './plugin-surfaces.js';\n")
          patch('src/plugin-init.ts',
            "export type PluginComponentKind = 'command' | 'agent' | 'skill' | 'hook' | 'mcp';",
            "export type PluginComponentKind = 'command' | 'agent' | 'skill' | 'hook' | 'mcp' | 'lsp';")
          patch('src/plugin-init.ts',
            "  mcpServers: PluginComponent[];\n  warnings: string[];",
            "  mcpServers: PluginComponent[];\n  lspServers: PluginLspServer[];\n  monitors: PluginMonitor[];\n  dependencies: PluginDependency[];\n  warnings: string[];")
          patch('src/plugin-init.ts',
            "function safeSlug(value: string): string {\n  return value.toLowerCase().replace(/[^a-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 80) || 'component';\n}",
            "function safeSlug(value: string): string {\n  const normalized = value.toLowerCase().replace(/[^a-z0-9._-]+/g, '-');\n  let start = 0;\n  while (start < normalized.length && normalized.charCodeAt(start) === 45) start += 1;\n  let end = normalized.length;\n  while (end > start && normalized.charCodeAt(end - 1) === 45) end -= 1;\n  return normalized.slice(start, Math.min(end, start + 80)) || 'component';\n}")
          patch('src/plugin-init.ts',
            "  const mcpServers = await collectMcp(root, manifest);\n  const warnings = [\n    ...duplicateNameWarnings(commands, 'command'),\n    ...duplicateNameWarnings(agents, 'agent'),\n    ...duplicateNameWarnings(skills, 'skill'),\n  ];\n\n  if (commands.length + agents.length + skills.length + hooks.length + mcpServers.length === 0) {\n    warnings.push('No commands, agents, skills, hooks or MCP servers were discovered.');\n  }",
            "  const mcpServers = await collectMcp(root, manifest);\n  const extended = await discoverExtendedPluginSurfaces(root, manifest);\n  const warnings = [\n    ...duplicateNameWarnings(commands, 'command'),\n    ...duplicateNameWarnings(agents, 'agent'),\n    ...duplicateNameWarnings(skills, 'skill'),\n    ...extended.warnings,\n  ];\n\n  if (commands.length + agents.length + skills.length + hooks.length + mcpServers.length + extended.lspServers.length + extended.monitors.length + extended.dependencies.length === 0) {\n    warnings.push('No commands, agents, skills, hooks, MCP servers, LSP servers, monitors or plugin dependencies were discovered.');\n  }")
          patch('src/plugin-init.ts',
            "    hooks,\n    mcpServers,\n    warnings,",
            "    hooks,\n    mcpServers,\n    lspServers: extended.lspServers,\n    monitors: extended.monitors,\n    dependencies: extended.dependencies,\n    warnings,")
          patch('src/plugin-init.ts',
            "  return baseScenario(\n    `plugin-${plugin}-mcp-${id}`,\n    `Smoke-test the Claude Code plugin ${plugin}. Confirm that the MCP server ${component.name} connects and, if it exposes a clearly read-only discovery/list/status tool, call one harmless tool. Do not perform mutations and do not modify repository files. Report connection, startup or tool-discovery errors.`,\n  );",
            "  if (component.kind === 'mcp') {\n    return baseScenario(\n      `plugin-${plugin}-mcp-${id}`,\n      `Smoke-test the Claude Code plugin ${plugin}. Confirm that the MCP server ${component.name} connects and, if it exposes a clearly read-only discovery/list/status tool, call one harmless tool. Do not perform mutations and do not modify repository files. Report connection, startup or tool-discovery errors.`,\n    );\n  }\n  return baseScenario(\n    `plugin-${plugin}-lsp-${id}`,\n    `Smoke-test the Claude Code plugin ${plugin}. Confirm that the LSP server ${component.name} registers without startup errors. If a matching source file exists, use only read-only LSP navigation such as hover, symbols or definition lookup. Do not modify repository files. Report missing executables, registration failures or unavailable LSP tooling.`,\n    false,\n    ['Executable not found', 'No LSP server available'],\n  );")
          patch('src/plugin-init.ts',
            "    ['hook', discovery.hooks],\n    ['mcp', discovery.mcpServers],",
            "    ['hook', discovery.hooks],\n    ['mcp', discovery.mcpServers],\n    ['lsp', discovery.lspServers],")

          patch('src/plugin-suite.ts',
            "export type PluginSuiteScenarioKind = 'load' | 'command' | 'agent' | 'skill' | 'hook' | 'mcp' | 'custom';",
            "export type PluginSuiteScenarioKind = 'load' | 'command' | 'agent' | 'skill' | 'hook' | 'mcp' | 'lsp' | 'custom';")
          patch('src/plugin-suite.ts',
            "function safeSlug(value: string): string {\n  return value.toLowerCase().replace(/[^a-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 80) || 'component';\n}",
            "function safeSlug(value: string): string {\n  const normalized = value.toLowerCase().replace(/[^a-z0-9._-]+/g, '-');\n  let start = 0;\n  while (start < normalized.length && normalized.charCodeAt(start) === 45) start += 1;\n  let end = normalized.length;\n  while (end > start && normalized.charCodeAt(end - 1) === 45) end -= 1;\n  return normalized.slice(start, Math.min(end, start + 80)) || 'component';\n}")
          patch('src/plugin-suite.ts',
            "  for (const kind of ['command', 'agent', 'skill', 'hook', 'mcp'] as const) {",
            "  for (const kind of ['command', 'agent', 'skill', 'hook', 'mcp', 'lsp'] as const) {")
          patch('src/plugin-suite.ts',
            "  return ['load', 'command', 'agent', 'skill', 'hook', 'mcp', 'custom'].indexOf(kind);",
            "  return ['load', 'command', 'agent', 'skill', 'hook', 'mcp', 'lsp', 'custom'].indexOf(kind);")

          start = Path('src/plugin-suite.ts').read_text(encoding='utf-8')
          a = start.index('function parsedDiscoverySurface(')
          b = start.index('\nfunction displaySurfaceKey', a)
          replacement = '''function parsedDiscoverySurface(value: unknown): { pluginName: string; keys: string[] } {
            if (typeof value !== 'object' || value === null || Array.isArray(value)) throw new Error('discovery.json must contain a JSON object.');
            const record = value as Record<string, unknown>;
            if (typeof record.pluginName !== 'string' || !record.pluginName) throw new Error('discovery.json is missing pluginName.');
            const keys: string[] = [];
            for (const field of ['commands', 'agents', 'skills', 'hooks', 'mcpServers'] as const) {
              const entries = record[field] ?? [];
              if (!Array.isArray(entries)) throw new Error(`discovery.json ${field} must be an array.`);
              for (const entry of entries) {
                if (typeof entry !== 'object' || entry === null || Array.isArray(entry)) throw new Error(`discovery.json ${field} contains an invalid component.`);
                const component = entry as Record<string, unknown>;
                if (typeof component.name !== 'string' || typeof component.path !== 'string') throw new Error(`discovery.json ${field} component is missing name/path.`);
                keys.push(`${field}\\u0000${component.name}\\u0000${component.path}`);
              }
            }
            const lsp = record.lspServers ?? [];
            if (!Array.isArray(lsp)) throw new Error('discovery.json lspServers must be an array.');
            for (const entry of lsp) {
              if (typeof entry !== 'object' || entry === null || Array.isArray(entry)) throw new Error('discovery.json lspServers contains an invalid component.');
              const component = entry as Record<string, unknown>;
              if (typeof component.name !== 'string' || typeof component.path !== 'string' || typeof component.command !== 'string' || !Array.isArray(component.extensions)) throw new Error('discovery.json LSP component is incomplete.');
              keys.push(`lspServers\\u0000${component.name}\\u0000${component.path}\\u0000${component.command}\\u0000${JSON.stringify(component.extensions)}`);
            }
            const monitors = record.monitors ?? [];
            if (!Array.isArray(monitors)) throw new Error('discovery.json monitors must be an array.');
            for (const entry of monitors) {
              if (typeof entry !== 'object' || entry === null || Array.isArray(entry)) throw new Error('discovery.json monitors contains an invalid component.');
              const monitor = entry as Record<string, unknown>;
              if (typeof monitor.name !== 'string' || typeof monitor.path !== 'string' || typeof monitor.command !== 'string' || typeof monitor.description !== 'string') throw new Error('discovery.json monitor is incomplete.');
              keys.push(`monitors\\u0000${monitor.name}\\u0000${monitor.path}\\u0000${monitor.command}\\u0000${monitor.description}\\u0000${String(monitor.when ?? '')}`);
            }
            const dependencies = record.dependencies ?? [];
            if (!Array.isArray(dependencies)) throw new Error('discovery.json dependencies must be an array.');
            for (const entry of dependencies) {
              if (typeof entry !== 'object' || entry === null || Array.isArray(entry)) throw new Error('discovery.json dependencies contains an invalid dependency.');
              const dependency = entry as Record<string, unknown>;
              if (typeof dependency.name !== 'string') throw new Error('discovery.json dependency is missing name.');
              keys.push(`dependencies\\u0000${dependency.name}\\u0000${String(dependency.version ?? '')}\\u0000${String(dependency.marketplace ?? '')}`);
            }
            return { pluginName: record.pluginName, keys: keys.sort() };
          }

          function liveDiscoverySurface(discovery: PluginDiscovery): string[] {
            const keys = [
              ...(['commands', 'agents', 'skills', 'hooks', 'mcpServers'] as const).flatMap((field) => discovery[field].map((entry) => `${field}\\u0000${entry.name}\\u0000${entry.path}`)),
              ...discovery.lspServers.map((entry) => `lspServers\\u0000${entry.name}\\u0000${entry.path}\\u0000${entry.command}\\u0000${JSON.stringify(entry.extensions)}`),
              ...discovery.monitors.map((entry) => `monitors\\u0000${entry.name}\\u0000${entry.path}\\u0000${entry.command}\\u0000${entry.description}\\u0000${entry.when ?? ''}`),
              ...discovery.dependencies.map((entry) => `dependencies\\u0000${entry.name}\\u0000${entry.version ?? ''}\\u0000${entry.marketplace ?? ''}`),
            ];
            return keys.sort();
          }
          '''
          Path('src/plugin-suite.ts').write_text(start[:a] + replacement + start[b:], encoding='utf-8')
          patch('src/plugin-suite.ts',
            "  for (const component of discovery.mcpServers) ids.push(`mcp-${safeSlug(component.name)}`);\n  return ids;",
            "  for (const component of discovery.mcpServers) ids.push(`mcp-${safeSlug(component.name)}`);\n  for (const component of discovery.lspServers) ids.push(`lsp-${safeSlug(component.name)}`);\n  return ids;")

          patch('src/plugin-matrix.ts',
            "function safeSlug(value: string): string {\n  return value.toLowerCase().replace(/[^a-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 80) || 'plugin';\n}",
            "function safeSlug(value: string): string {\n  const normalized = value.toLowerCase().replace(/[^a-z0-9._-]+/g, '-');\n  let start = 0;\n  while (start < normalized.length && normalized.charCodeAt(start) === 45) start += 1;\n  let end = normalized.length;\n  while (end > start && normalized.charCodeAt(end - 1) === 45) end -= 1;\n  return normalized.slice(start, Math.min(end, start + 80)) || 'plugin';\n}")

          patch('src/api.ts',
            "export { discoverPlugin, generatePluginScenarios } from './plugin-init.js';",
            "export { discoverPlugin, generatePluginScenarios } from './plugin-init.js';\nexport type { PluginComponent, PluginComponentKind, PluginDiscovery, PluginInitOptions, PluginInitResult, GeneratedPluginScenario } from './plugin-init.js';\nexport { discoverExtendedPluginSurfaces } from './plugin-surfaces.js';\nexport type { PluginDependency, PluginExtendedSurfaces, PluginLspServer, PluginMonitor, PluginSurfaceSource } from './plugin-surfaces.js';")

          patch('test/plugin-suite.test.ts',
            "    mcpServers: [],\n    warnings: [],",
            "    mcpServers: [],\n    lspServers: [],\n    monitors: [],\n    dependencies: [],\n    warnings: [],")
          patch('test/plugin-suite.test.ts',
            "    await writeFile(path.join(suite, 'hook-stop.canary.yml'), scenarioYaml('hook-stop'), 'utf8');\n\n    const loaded = await loadGeneratedPluginSuite(suite);\n    expect(loaded.map((entry) => entry.id)).toEqual(['load', 'command-review', 'skill-guide', 'hook-stop']);\n    expect(loaded.map((entry) => entry.kind)).toEqual(['load', 'command', 'skill', 'hook']);",
            "    await writeFile(path.join(suite, 'hook-stop.canary.yml'), scenarioYaml('hook-stop'), 'utf8');\n    await writeFile(path.join(suite, 'lsp-typescript.canary.yml'), scenarioYaml('lsp-typescript'), 'utf8');\n\n    const loaded = await loadGeneratedPluginSuite(suite);\n    expect(loaded.map((entry) => entry.id)).toEqual(['load', 'command-review', 'skill-guide', 'hook-stop', 'lsp-typescript']);\n    expect(loaded.map((entry) => entry.kind)).toEqual(['load', 'command', 'skill', 'hook', 'lsp']);")

          addition = '''

            it('marks generated suites stale when extended static surfaces change', async () => {
              const root = await tempRoot();
              const suite = path.join(root, 'suite');
              await mkdir(suite, { recursive: true });
              const live = discovery(root);
              const extended: PluginDiscovery = {
                ...live,
                lspServers: [{ kind: 'lsp', name: 'ts', path: '.lsp.json', source: 'default', command: 'typescript-language-server', extensions: ['.ts'] }],
                monitors: [{ name: 'errors', path: 'monitors/monitors.json', source: 'default', command: 'tail -F errors.log', description: 'Errors' }],
                dependencies: [{ name: 'shared-tools', version: '^1.0.0' }],
              };
              await writeDiscoveryFile(suite, extended);
              await expect(assertGeneratedPluginSuiteFresh(suite, extended)).resolves.toBeUndefined();
              await expect(assertGeneratedPluginSuiteFresh(suite, {
                ...extended,
                dependencies: [{ name: 'shared-tools', version: '^2.0.0' }],
              })).rejects.toThrow(/stale/i);
              await expect(assertGeneratedPluginSuiteFresh(suite, {
                ...extended,
                lspServers: [{ ...extended.lspServers[0]!, command: 'different-lsp' }],
              })).rejects.toThrow(/stale/i);
            });
          '''
          p = Path('test/plugin-suite.test.ts')
          text = p.read_text(encoding='utf-8')
          marker = "\n  it('requires every generated component scenario while allowing custom extras', () => {"
          if marker not in text: raise SystemExit('plugin suite insertion marker missing')
          p.write_text(text.replace(marker, addition + marker, 1), encoding='utf-8')

          addition = '''

            it('exposes LSP, monitor and dependency declarations through plugin discovery', async () => {
              const root = await tempRoot();
              const plugin = path.join(root, 'extended-plugin');
              await mkdir(path.join(plugin, '.claude-plugin'), { recursive: true });
              await mkdir(path.join(plugin, 'monitors'), { recursive: true });
              await writeFile(path.join(plugin, '.claude-plugin', 'plugin.json'), JSON.stringify({
                name: 'extended-plugin',
                dependencies: [{ name: 'shared-tools', version: '~2.1.0' }],
              }), 'utf8');
              await writeFile(path.join(plugin, '.lsp.json'), JSON.stringify({
                typescript: { command: 'typescript-language-server', args: ['--stdio'], extensionToLanguage: { '.ts': 'typescript' } },
              }), 'utf8');
              await writeFile(path.join(plugin, 'monitors', 'monitors.json'), JSON.stringify([
                { name: 'errors', command: 'tail -F errors.log', description: 'Error stream' },
              ]), 'utf8');
              const found = await discoverPlugin(plugin);
              expect(found.lspServers.map((entry) => entry.name)).toEqual(['typescript']);
              expect(found.monitors.map((entry) => entry.name)).toEqual(['errors']);
              expect(found.dependencies).toEqual([{ name: 'shared-tools', version: '~2.1.0' }]);

              const project = path.join(root, 'project');
              await mkdir(project, { recursive: true });
              const generated = await generatePluginScenarios(plugin, { cwd: project });
              expect(generated.scenarios.some((entry) => entry.kind === 'lsp' && entry.component === 'typescript')).toBe(true);
              expect(generated.scenarios.some((entry) => entry.kind === ('monitor' as never))).toBe(false);
            });
          '''
          p = Path('test/plugin-init.test.ts')
          text = p.read_text(encoding='utf-8')
          marker = "\n  it('requires safe ./ manifest component paths', async () => {"
          if marker not in text: raise SystemExit('plugin init insertion marker missing')
          p.write_text(text.replace(marker, addition + marker, 1), encoding='utf-8')

          patch('README.md',
            "- MCP servers\n\nGenerated suites are marker-protected",
            "- MCP servers\n- LSP servers\n- background monitors (static contract only; never auto-started by Canary)\n- plugin dependencies and version constraints (static contract only)\n\nGenerated suites are marker-protected")
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate
        run: npm run check
      - name: Package sanity
        run: npm pack --dry-run --ignore-scripts
      - name: Commit validated integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test README.md
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate LSP monitor and dependency surfaces"
          git push origin HEAD:feat/plugin-compat-surfaces
