name: Prepare v1.1.0 once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Prepare exact release candidate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/set-version.mjs 1.1.0
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          let readme = await readFile('README.md', 'utf8');
          readme = readme.replace(
            '<img alt="v1.0.1" src="https://img.shields.io/badge/Claude%20Canary-v1.0.1-f7c948">',
            '<img alt="v1.1.0" src="https://img.shields.io/badge/Claude%20Canary-v1.1.0-f7c948">',
          );
          const oldInstall = `Until the npm package is published, install the CLI from source:\n\n\`\`\`bash\ngit clone https://github.com/SLP-DEV1/claude-code-canary.git\ncd claude-code-canary\nnpm ci --ignore-scripts\nnpm run build\nnpm link\n\nclaude-canary --version\nclaude-canary doctor\n\`\`\``;
          const newInstall = `Install the published CLI from npm:\n\n\`\`\`bash\nnpm install -g claude-code-canary\n\nclaude-canary --version\nclaude-canary doctor\n\`\`\`\n\nFor repository development, clone this repo and run \`npm ci --ignore-scripts && npm run build\`.`;
          if (!readme.includes(oldInstall)) throw new Error('README install anchor not found.');
          readme = readme.replace(oldInstall, newInstall);
          if (!readme.includes('Current package version: **v1.0.1**.')) throw new Error('README version anchor not found.');
          readme = readme.replace('Current package version: **v1.0.1**.', 'Current package version: **v1.1.0**.');
          await writeFile('README.md', readme, 'utf8');

          let changelog = await readFile('CHANGELOG.md', 'utf8');
          const marker = '## [Unreleased]\n\n### Added\n';
          if (!changelog.includes(marker)) throw new Error('CHANGELOG Unreleased anchor not found.');
          changelog = changelog.replace(marker, '## [Unreleased]\n\n## [1.1.0] - 2026-08-27\n\n### Added\n');
          await writeFile('CHANGELOG.md', changelog, 'utf8');
          NODE
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm pack --dry-run --ignore-scripts
          rm .github/workflows/prepare-v1.1.0-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: prepare v1.1.0 release candidate"
          git push origin HEAD:main
