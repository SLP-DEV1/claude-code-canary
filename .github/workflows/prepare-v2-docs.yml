name: Prepare v2 docs

on:
  push:
    branches:
      - feat/v2-platform
    paths:
      - .github/workflows/prepare-v2-docs.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v2-platform
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Apply v2 documentation migration
        run: node scripts/prepare-v2-docs.mjs
      - name: Commit documentation
        shell: bash
        run: |
          set -euo pipefail
          git add README.md docs/GITHUB_ACTION.md CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: document v2.0 compatibility platform"
          git push origin HEAD:feat/v2-platform
