name: Prepare v1.2.0 candidate once

on:
  push:
    branches:
      - release/v1.2.0
    paths:
      - .github/workflows/release-v120-prep-once.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v1.2.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Set v1.2.0 metadata
        run: npm run release:version -- 1.2.0
      - name: Finalize release-facing docs
        shell: python
        run: |
          from pathlib import Path

          def patch(file, old, new):
              p = Path(file)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected release marker missing in {file}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          patch(
              'CHANGELOG.md',
              '## [Unreleased]\n\n### Added\n',
              '## [Unreleased]\n\n## [1.2.0] - 2026-08-27\n\n### Added\n',
          )
          patch(
              'README.md',
              '<img alt="v1.1.0" src="https://img.shields.io/badge/Claude%20Canary-v1.1.0-f7c948">',
              '<img alt="v1.2.0" src="https://img.shields.io/badge/Claude%20Canary-v1.2.0-f7c948">',
          )
          patch(
              'ROADMAP.md',
              'Current stable release: **v1.1.0**.',
              'Current stable release: **v1.2.0**.',
          )
      - run: npm run version:check
      - run: npm run check
      - run: npm pack --dry-run --ignore-scripts
      - name: Commit validated release candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/version.ts CHANGELOG.md README.md ROADMAP.md
          git diff --cached --quiet && exit 0
          git commit -m "release: prepare Claude Canary v1.2.0"
          git push origin HEAD:release/v1.2.0
