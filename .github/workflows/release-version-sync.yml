name: Release version sync

on:
  push:
    branches:
      - 'release/**'
    paths:
      - package.json
      - package-lock.json
      - src/version.ts
      - .github/workflows/release-version-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Synchronize release metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          node scripts/set-version.mjs "$version"
          node scripts/check-version-sync.mjs
      - name: Commit synchronized lock metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json src/version.ts; then
            echo 'Release version metadata already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src/version.ts
          git commit -m 'release: synchronize version metadata'
          git push origin "HEAD:${GITHUB_REF_NAME}"
