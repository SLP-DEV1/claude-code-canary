name: Publish npm

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Exact immutable release tag to publish, for example v1.0.1.
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve and validate release tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag='${{ inputs.tag }}'
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 2
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund

      - name: Install, verify and build
        run: |
          npm --version
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm pack --dry-run --ignore-scripts

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          const expected = `v${pkg.version}`;
          if (process.env.RELEASE_TAG !== expected) {
            throw new Error(`Release tag ${process.env.RELEASE_TAG} does not match package version ${pkg.version}. Expected ${expected}.`);
          }
          console.log(`Publishing ${pkg.name}@${pkg.version} from ${process.env.RELEASE_TAG}.`);
          NODE

      - name: Publish package
        env:
          # OIDC Trusted Publishing is preferred. NPM_TOKEN exists only as an
          # optional bootstrap fallback for the package's first publication.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Move floating major Action tag
        id: major
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          major_tag="v${version%%.*}"
          release_sha="$(git rev-parse HEAD)"
          git tag -f "$major_tag" "$release_sha"
          git push origin "refs/tags/$major_tag" --force
          echo "tag=$major_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Write release summary
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          MAJOR_TAG: ${{ steps.major.outputs.tag }}
        shell: bash
        run: |
          {
            echo "### npm release"
            echo
            echo "- Exact tag: \`$RELEASE_TAG\`"
            echo "- npm package: \`claude-code-canary@${RELEASE_TAG#v}\`"
            echo "- Floating Action tag: \`$MAJOR_TAG\`"
            echo "- Provenance: npm Trusted Publishing/OIDC when configured"
          } >> "$GITHUB_STEP_SUMMARY"
