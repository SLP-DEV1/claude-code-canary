name: Commit validated agent-team product once

on:
  push:
    branches:
      - feat/agent-team-regressions
    paths:
      - .github/workflows/team-commit-product-once.yml

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/agent-team-regressions
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Reapply previously validated product patch
        shell: python
        run: |
          from pathlib import Path
          source = Path('.github/workflows/team-integrate-v2-once.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == 'run: |' and i > 0 and 'Apply agent-team integration' in source[i - 2]) + 1
          end = next(i for i in range(start, len(source)) if source[i].startswith('      - run: npm ci'))
          lines = []
          for line in source[start:end]:
              if "patch('.github/workflows/ci.yml'" in line:
                  continue
              lines.append(line[10:] if line.startswith('          ') else line)
          exec('\n'.join(lines), {'__builtins__': __builtins__})
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm pack --dry-run --ignore-scripts
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test README.md ROADMAP.md CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "feat: expose agent-team regression workflows"
          git push origin HEAD:feat/agent-team-regressions
