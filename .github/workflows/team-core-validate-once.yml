name: Validate agent-team core once

on:
  push:
    branches:
      - feat/agent-team-regressions
    paths:
      - .github/workflows/team-core-validate-once.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/agent-team-regressions
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm pack --dry-run --ignore-scripts
