name: Integrate agent-team CLI v2 once

on:
  push:
    branches:
      - feat/agent-team-regressions
    paths:
      - .github/workflows/team-integrate-v2-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/agent-team-regressions
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Apply agent-team integration
        shell: python
        run: |
          from pathlib import Path
          import base64
          def dec(v): return base64.b64decode(v).decode('utf-8')
          def patch(file, old, new):
              p=Path(file); text=p.read_text(encoding='utf-8')
              if old not in text: raise SystemExit(f'expected block missing in {file}: {old[:100]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')
          team=dec('')
          api=dec('')
          readme=dec('')
          plugin=dec('')
          teamblock=dec('')
          patch('src/index.ts',"import { checkBaseline, updateBaseline } from './baseline.js';\n", "import { checkBaseline, updateBaseline } from './baseline.js';\nimport { compareAgentTeamResults, formatAgentTeamComparison, formatAgentTeamRun, loadAgentTeamResult, loadAgentTeamScenario, runAgentTeam } from './agent-team.js';\n")
          p=Path('src/index.ts'); text=p.read_text(encoding='utf-8'); marker="\nprogram.command('plugin-init')\n"; p.write_text(text.replace(marker,'\n'+team+marker,1),encoding='utf-8') if marker in text else (_ for _ in ()).throw(SystemExit('plugin marker missing'))
          p=Path('src/api.ts'); text=p.read_text(encoding='utf-8'); marker="export { ScenarioSchema, loadScenario, parseScenario } from './config.js';\n"; p.write_text(text.replace(marker,api+marker,1),encoding='utf-8') if marker in text else (_ for _ in ()).throw(SystemExit('api marker missing'))
          patch('test/api.test.ts',"      'runScenario',\n", "      'runScenario',\n      'AgentTeamScenarioSchema',\n      'runAgentTeam',\n      'compareAgentTeamResults',\n")
          patch('.github/workflows/ci.yml',"            [['plugin-init', '--help'], 'generate smoke-test scenarios'],\n", "            [['team-run', '--help'], 'real interactive Claude Code agent team'],\n            [['team-compare', '--help'], 'saved agent-team observation artifacts'],\n            [['plugin-init', '--help'], 'generate smoke-test scenarios'],\n")
          patch('src/agent-team.ts',"    let timedOut = false;\n    const timer = setTimeout(() => {\n      timedOut = true;\n      child.kill('SIGTERM');\n    }, options.timeoutMs);\n    child.once('error', (error) => { clearTimeout(timer); reject(error); });\n    child.once('exit', (code, signal) => { clearTimeout(timer); resolve({ code, signal, timedOut }); });", "    let timedOut = false;\n    let forceTimer: NodeJS.Timeout | undefined;\n    const timer = setTimeout(() => {\n      timedOut = true;\n      child.kill('SIGTERM');\n      forceTimer = setTimeout(() => child.kill('SIGKILL'), 5000);\n    }, options.timeoutMs);\n    child.once('error', (error) => { clearTimeout(timer); if (forceTimer) clearTimeout(forceTimer); reject(error); });\n    child.once('exit', (code, signal) => { clearTimeout(timer); if (forceTimer) clearTimeout(forceTimer); resolve({ code, signal, timedOut }); });")
          patch('src/agent-team.ts',"    if (processResult.code !== 0 && processResult.code !== null) failures.push(`Interactive Claude team session exited with code ${processResult.code}`);\n    failures.push(...evaluateAgentTeamExpectations(scenario, metrics));", "    if (processResult.code !== 0 && processResult.code !== null) failures.push(`Interactive Claude team session exited with code ${processResult.code}`);\n    if (processResult.signal) failures.push(`Interactive Claude team session terminated by signal ${processResult.signal}`);\n    failures.push(...evaluateAgentTeamExpectations(scenario, metrics));")
          patch('src/agent-team.ts',"  if (baseline.status === 'unsupported') failures.push('Baseline team run is unsupported and cannot establish a compatibility contract');", "  if (baseline.status !== 'passed') failures.push(`Baseline team run status is ${baseline.status} and cannot establish a compatibility contract`);")
          p=Path('README.md'); text=p.read_text(encoding='utf-8'); text=text.replace('  <a href="docs/MCP_CONTRACTS.md">MCP contracts</a> ·\n','  <a href="docs/MCP_CONTRACTS.md">MCP contracts</a> ·\n  <a href="docs/AGENT_TEAMS.md">Agent teams</a> ·\n',1); text=text.replace('| "Did my MCP server silently change?" | Snapshot tools/prompts/resources and fail on removed tools, schema changes or capability regressions. |\n','| "Did my MCP server silently change?" | Snapshot tools/prompts/resources and fail on removed tools, schema changes or capability regressions. |\n| "Did Claude change how my agent team coordinates?" | Observe real interactive teammate/task lifecycle signals and compare privacy-safe structural snapshots. |\n',1); marker='\n### Gate a pull request\n'; p.write_text(text.replace(marker,'\n'+readme+marker,1),encoding='utf-8') if marker in text else (_ for _ in ()).throw(SystemExit('readme marker missing'))
          p=Path('ROADMAP.md'); text=p.read_text(encoding='utf-8'); a=text.index('### P0 — Plugin surface coverage: LSP, monitors and dependencies'); b=text.index('### P0 — Agent-team regression testing',a); c=text.index('### P1 — Extension compatibility doctor',b); p.write_text(text[:a]+plugin+teamblock+text[c:],encoding='utf-8')
          p=Path('CHANGELOG.md'); text=p.read_text(encoding='utf-8'); marker='### Added\n\n'; entries='- Add `team-run` for real interactive Claude Code agent-team observation with privacy-safe teammate/task/message lifecycle snapshots and deterministic expectations.\n- Add `team-compare`, a public agent-team result schema/API, bounded observer logs, explicit non-TTY `unsupported` results, and exact-release execution through Canary\'s verified Claude Code cache.\n'; p.write_text(text.replace(marker,marker+entries,1),encoding='utf-8')
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm pack --dry-run --ignore-scripts
      - name: Commit validated integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test .github/workflows/ci.yml README.md ROADMAP.md CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "feat: expose agent-team regression workflows"
          git push origin HEAD:feat/agent-team-regressions
