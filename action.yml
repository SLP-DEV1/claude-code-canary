name: Claude Canary
description: Regression-test Claude Code releases with deterministic Canary scenarios.
author: SLP-DEV1

branding:
  icon: activity
  color: yellow

inputs:
  scenario:
    description: Path to the Canary scenario in the checked-out repository.
    required: false
    default: .canary/basic.canary.yml
  from:
    description: Known-good Claude Code release (x.y.z, stable, or latest).
    required: true
  to:
    description: Candidate Claude Code release (x.y.z, stable, or latest).
    required: false
    default: latest
  node-version:
    description: Node.js version used to build and run Claude Canary.
    required: false
    default: "22"
  upload-results:
    description: Upload .canary/results JSON files as a workflow artifact.
    required: false
    default: "true"

outputs:
  results-path:
    description: Directory containing Claude Canary JSON result artifacts.
    value: ${{ steps.canary.outputs.results-path }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install Claude Canary dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm install --ignore-scripts --no-audit --no-fund

    - name: Build Claude Canary
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm run build

    - name: Compare Claude Code releases
      id: canary
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CANARY_SCENARIO: ${{ inputs.scenario }}
        CANARY_FROM: ${{ inputs.from }}
        CANARY_TO: ${{ inputs.to }}
      run: |
        output_file="${RUNNER_TEMP}/claude-canary-output.txt"
        set +e
        node "${GITHUB_ACTION_PATH}/dist/index.js" compare "${CANARY_SCENARIO}" --from "${CANARY_FROM}" --to "${CANARY_TO}" 2>&1 | tee "${output_file}"
        status=${PIPESTATUS[0]}
        set -e

        echo "results-path=${GITHUB_WORKSPACE}/.canary/results" >> "${GITHUB_OUTPUT}"

        {
          echo "## Claude Canary"
          echo
          echo "**Baseline:** \`${CANARY_FROM}\`  "
          echo "**Candidate:** \`${CANARY_TO}\`"
          echo
          echo '```text'
          cat "${output_file}"
          echo '```'
        } >> "${GITHUB_STEP_SUMMARY}"

        exit "${status}"

    - name: Upload Claude Canary results
      if: ${{ always() && inputs.upload-results == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: claude-canary-results-${{ github.run_id }}
        path: ${{ github.workspace }}/.canary/results/*.json
        if-no-files-found: warn
        retention-days: 14
