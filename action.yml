name: Claude Code Canary
description: Regression-test Claude Code releases, plugins, MCP servers and configs with deterministic scenarios and version bisecting.
author: SLP-DEV1

branding:
  icon: activity
  color: yellow

inputs:
  mode:
    description: "Canary workflow: compare, run, pr-check, baseline-check, mcp-check, plugin-matrix, plugin-suite, suite, or watch."
    required: false
    default: compare
  scenario:
    description: Scenario path. Defaults to .canary/basic.canary.yml, or .canary/plugin-smoke.canary.yml for plugin-matrix.
    required: false
    default: ""
  from:
    description: Baseline release for compare, or oldest exact release for plugin range mode.
    required: false
    default: ""
  to:
    description: Candidate release for compare, or newest exact release for plugin range mode.
    required: false
    default: ""
  base-ref:
    description: Git ref used as the base for pr-check. Pull-request base SHA is auto-detected when blank.
    required: false
    default: ""
  head-ref:
    description: Git ref used as the candidate for pr-check. Pull-request head SHA is auto-detected when blank.
    required: false
    default: ""
  baseline:
    description: Optional committed baseline JSON path for baseline-check. Defaults to .canary/baselines/<scenario-name>.json.
    required: false
    default: ""
  mcp-contract:
    description: MCP contract YAML for mcp-check. Defaults to .canary/mcp/server.mcp.yml.
    required: false
    default: ""
  mcp-require-baseline:
    description: Require a committed MCP baseline when mode=mcp-check.
    required: false
    default: "true"
  comment-pr:
    description: "Best-effort update of one stable Canary PR comment for pr-check. Requires pull-requests: write."
    required: false
    default: "false"
  plugin:
    description: Plugin directory for plugin-matrix or plugin-suite.
    required: false
    default: ""
  suite:
    description: Scenario suite for suite/watch, or generated plugin suite directory for plugin-suite.
    required: false
    default: ""
  versions:
    description: Space- or comma-separated exact Claude Code versions for plugin compatibility tests.
    required: false
    default: ""
  last:
    description: Number of newest published releases for plugin compatibility tests.
    required: false
    default: "10"
  platform:
    description: Override Claude Code release platform id.
    required: false
    default: ""
  max-runs:
    description: Maximum run budget for suite or plugin-suite.
    required: false
    default: "200"
  fail-on-incompatible:
    description: Fail the Action when a plugin release/scenario is incompatible.
    required: false
    default: "true"
  tag:
    description: Optional scenario tag selector for suite/watch.
    required: false
    default: ""
  shard:
    description: Deterministic suite shard in N/M form, for example 2/4.
    required: false
    default: ""
  concurrency:
    description: Maximum concurrent scenarios for suite/watch.
    required: false
    default: ""
  reuse-results:
    description: Reuse only compatibility-identical cached scenario results in suite/watch.
    required: false
    default: "false"
  watch-state:
    description: Release watcher state file. Defaults to .canary/watch-state.json.
    required: false
    default: ""
  watch-good:
    description: Initial exact known-good Claude Code release when bootstrapping watch mode.
    required: false
    default: ""
  check-only:
    description: In watch mode, report unseen releases without launching Claude or mutating watch state.
    required: false
    default: "false"
  node-version:
    description: Node.js version used to build and run Claude Canary.
    required: false
    default: "22"
  upload-results:
    description: Upload .canary/results as a workflow artifact.
    required: false
    default: "true"
  artifact-name:
    description: Optional artifact name override. Leave blank for an automatic unique name.
    required: false
    default: ""
  retention-days:
    description: Artifact retention in days.
    required: false
    default: "14"

outputs:
  results-path:
    description: Directory containing Claude Canary result artifacts.
    value: ${{ steps.canary.outputs.results-path }}
  report-path:
    description: Combined Markdown report path when the selected mode creates one.
    value: ${{ steps.canary.outputs.report-path }}
  passed:
    description: Whether the Canary command passed.
    value: ${{ steps.canary.outputs.passed }}
  exit-code:
    description: Claude Canary CLI exit code.
    value: ${{ steps.canary.outputs.exit-code }}
  artifact-name:
    description: Default unique artifact name generated by Claude Canary.
    value: ${{ steps.canary.outputs.artifact-name }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install Claude Canary dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline

    - name: Build Claude Canary
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm run build

    - name: Ensure pull request refs are available
      if: ${{ inputs.mode == 'pr-check' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CANARY_MODE: ${{ inputs.mode }}
        CANARY_BASE_REF: ${{ inputs.base-ref }}
        CANARY_HEAD_REF: ${{ inputs.head-ref }}
      run: node "${GITHUB_ACTION_PATH}/scripts/ensure-pr-refs.mjs"

    - name: Run Claude Canary
      id: canary
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CANARY_MODE: ${{ inputs.mode }}
        CANARY_SCENARIO: ${{ inputs.scenario }}
        CANARY_FROM: ${{ inputs.from }}
        CANARY_TO: ${{ inputs.to }}
        CANARY_BASE_REF: ${{ inputs.base-ref }}
        CANARY_HEAD_REF: ${{ inputs.head-ref }}
        CANARY_BASELINE: ${{ inputs.baseline }}
        CANARY_MCP_CONTRACT: ${{ inputs.mcp-contract }}
        CANARY_MCP_REQUIRE_BASELINE: ${{ inputs.mcp-require-baseline }}
        CANARY_PLUGIN: ${{ inputs.plugin }}
        CANARY_SUITE: ${{ inputs.suite }}
        CANARY_VERSIONS: ${{ inputs.versions }}
        CANARY_LAST: ${{ inputs.last }}
        CANARY_PLATFORM: ${{ inputs.platform }}
        CANARY_MAX_RUNS: ${{ inputs.max-runs }}
        CANARY_FAIL_ON_INCOMPATIBLE: ${{ inputs.fail-on-incompatible }}
        CANARY_TAG: ${{ inputs.tag }}
        CANARY_SHARD: ${{ inputs.shard }}
        CANARY_CONCURRENCY: ${{ inputs.concurrency }}
        CANARY_REUSE_RESULTS: ${{ inputs.reuse-results }}
        CANARY_WATCH_STATE: ${{ inputs.watch-state }}
        CANARY_WATCH_GOOD: ${{ inputs.watch-good }}
        CANARY_CHECK_ONLY: ${{ inputs.check-only }}
      run: node "${GITHUB_ACTION_PATH}/scripts/action-runner.mjs"

    - name: Update Claude Canary pull request comment
      if: ${{ always() && inputs.comment-pr == 'true' && inputs.mode == 'pr-check' }}
      continue-on-error: true
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CANARY_REPORT_PATH: ${{ steps.canary.outputs.report-path }}
      run: node "${GITHUB_ACTION_PATH}/scripts/pr-comment.mjs"

    - name: Upload Claude Canary results
      if: ${{ always() && inputs.upload-results == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ inputs.artifact-name != '' && inputs.artifact-name || format('claude-canary-results-{0}-{1}', github.run_id, github.run_attempt) }}
        path: ${{ github.workspace }}/.canary/results/
        if-no-files-found: warn
        include-hidden-files: true
        retention-days: ${{ inputs.retention-days }}
