      <stop offset="0" stop-color="#090b10"/>
      <stop offset="1" stop-color="#171b24"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7c948" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#f7c948" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f7c948" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
