name: Claude Canary — release compare

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare Claude Code releases
        uses: SLP-DEV1/claude-code-canary@v1
        with:
          mode: compare
          scenario: .canary/basic.canary.yml
          from: 2.1.220
          to: latest
          upload-results: "true"
