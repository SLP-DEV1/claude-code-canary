name: Publish Canary compatibility registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - compatibility.registry.json
      - .github/workflows/publish-compatibility-registry.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: claude-canary-compatibility-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Build static compatibility registry
        run: >-
          npx --yes claude-code-canary@2
          registry publish compatibility.registry.json
          --output .canary/registry-site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .canary/registry-site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
