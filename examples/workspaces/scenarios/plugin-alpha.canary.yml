version: 1
name: multi-plugin-alpha-smoke

tags:
  - multi-plugin
  - plugin-alpha

affects:
  - plugins/alpha/**

prompt: |
  Treat this as a cheap plugin-selection smoke test for plugin alpha.
  Do not edit files. Respond with exactly PLUGIN_ALPHA_OK.

claude:
  executable: claude
  permission_mode: dontAsk
  max_turns: 2
  timeout_seconds: 120

expect:
  claude_output_contains:
    - PLUGIN_ALPHA_OK

limits:
  max_tool_calls: 5
  max_total_tokens: 20000
