version: 1
name: multi-plugin-marketplace-contract

tags:
  - multi-plugin
  - marketplace

affects:
  - .claude-plugin/marketplace.json
  - plugins/*/.claude-plugin/plugin.json
  - plugins/*/.claude-plugin/marketplace.json

prompt: |
  Treat this as a cheap shared marketplace/manifest contract smoke test.
  Do not edit files. Respond with exactly PLUGIN_MARKETPLACE_OK.

claude:
  executable: claude
  permission_mode: dontAsk
  max_turns: 2
  timeout_seconds: 120

expect:
  claude_output_contains:
    - PLUGIN_MARKETPLACE_OK

limits:
  max_tool_calls: 5
  max_total_tokens: 20000
